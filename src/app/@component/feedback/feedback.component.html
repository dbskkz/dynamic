<div class="flex">
  <table mat-table [dataSource]="dataSource" >
  <!-- Position Column -->
      <ng-container matColumnDef="No" sticky>
        <th mat-header-cell *matHeaderCellDef>No.</th>
        <td mat-cell *matCellDef="let element;let i= index">{{i+1}}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="Name">
        <th mat-header-cell *matHeaderCellDef> 填寫人 </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <!-- Weight Column -->
      <ng-container matColumnDef="Date">
        <th mat-header-cell *matHeaderCellDef> 填寫日期 </th>
        <td mat-cell *matCellDef="let element"> {{element.data|date:'yyyy-MM-dd'}}
        </td>
      </ng-container>

      <!-- Symbol Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>  </th>
        <td mat-cell *matCellDef="let element">
        <button matButton="elevated" (click)="Check()">查看回答</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
