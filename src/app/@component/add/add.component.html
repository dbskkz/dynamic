<div class="container">
  <div class="left" [class.full]="!showreview">
    <div class="content">
      <h1>問卷基本資料</h1>
      <div class="field">
        <label class="text">問卷名稱(必填)：</label>
        <input type="text" [(ngModel)]="name" class="name bordline" required>
      </div>

      <div class="field">
        <label class="text">問卷說明：</label>
        <textarea [(ngModel)]="explain" class="explain bordline" ></textarea>
      </div>

          <!-- 日期選擇 -->
      <div class="field">
        <label class="text">開始日期：</label>
        <mat-form-field appearance="outline">
          <input matInput [matDatepicker]="startPicker" [(ngModel)]="starday"
            [max]="enday" [min]="today" placeholder="選擇開始日期">
          <mat-datepicker-toggle matSuffix [for]="startPicker">
          <mat-icon matDatepickerToggleIcon>keyboard_arrow_down</mat-icon>
          </mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="field">
        <label class="text">結束日期：</label>
        <mat-form-field appearance="outline">
          <input matInput [matDatepicker]="endPicker" [(ngModel)]="enday"
            [min]="starday" placeholder="選擇結束日期">
          <mat-datepicker-toggle matSuffix [for]="endPicker">
          <mat-icon matDatepickerToggleIcon>keyboard_arrow_down</mat-icon>
          </mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>
      </div>

      <app-add-data (dataChange)="onDataChange($event)" class="data"></app-add-data>

      <div class="actions">
          <button class="btn-back" mat-stroked-button matButton="outlined" (click)="back()">返回</button>
          <button class="btn-preview" [class.active]="showreview" mat-stroked-button matButton="outlined" (click)="view()">{{showreview?'收起預覽':'預覽'}}</button>
          <button class="btn-reset" mat-stroked-button matButton="outlined" (click)="reset()">清除</button>
          <button class="btn-action" mat-stroked-button matButton="outlined" (click)="save()">儲存</button>
          <button class="btn-action" mat-stroked-button matButton="outlined" (click)="send()">儲存並發布</button>
      </div>

    </div>
  </div>

  <div class="right" *ngIf="showreview">
    <p>問卷預覽</p>
    <app-review [data]="surveyData" mode="preview"></app-review>
  </div>
</div>
