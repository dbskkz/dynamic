<nav mat-tab-nav-bar [tabPanel]="tabPanel">

    <a mat-tab-link
    [routerLink]="link.path"
    routerLinkActive
    #rla="routerLinkActive"
    [active]=rla.isActive> {{link.label}} </a>
  }
</nav>

<mat-tab-nav-panel #tabPanel>
  <router-outlet></router-outlet>
</mat-tab-nav-panel>
