<h2>新增問題</h2>
      <div>
        <div>
          <label for="">題目:</label>
          <input type="text" [(ngModel)]="title">
          <mat-checkbox [(ngModel)]="required">必填</mat-checkbox>
        </div>

        <div>
          <label >題目類型:</label>
          <select [(ngModel)]="select"
                  [compareWith]="compare">
            <option [ngValue]="undefined" disabled selected>請選擇題目類型</option>
            <!-- 預設選項的顯示沒有出現！！！ -->
            <option value="Single">單選題</option>
            <option value="Multiple">複選題</option>
            <option value="question">問答題</option>
          </select>
          <br>
          <div class="bordline options mind padd" *ngIf="select!=='question'">
            <label>選項內容:</label>
            <div *ngFor="let item of items; let i = index; trackBy: trackByIndex" >
              <span>{{ i + 1 }}.</span>
              <input #itemInput [(ngModel)]="items[i]" type="text">
              <button type="button" (click)="removeItem(i)">-</button>
            </div>
            <button type="button" (click)="addItem()"
              [disabled]="items.length > 0 && items[items.length-1].trim() === ''">新增選項
            </button>
          </div>
          <div>
            <button type="submit" (click)="addQuestion()">新增題目</button>
            <button type="reset">取消</button>
          </div>
        </div>
      </div>

    <div class=" options">
        <table mat-table [dataSource]="dataSource">


          <!-- Position Column -->
          <ng-container matColumnDef="drag" sticky>
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let element">
            <mat-icon cdkDragHandle>reorder</mat-icon>
          </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> 題目 </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
          </ng-container>

          <!-- Weight Column -->
          <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef> 類型 </th>
            <td mat-cell *matCellDef="let element"> {{element.type}}
            </td>
          </ng-container>

          <!-- Symbol Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>  </th>
            <td mat-cell *matCellDef="let element">
            <button matButton="elevated" (click)="Delete()">刪除</button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"
              cdkDrag
              cdkDragRootElement=".cdk-drag"></tr>
        </table>
    </div>
